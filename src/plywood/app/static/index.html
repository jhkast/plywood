<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plywood</title>
  <link rel="stylesheet" href="app.css">
  <script src="app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.9/dist/cdn.min.js"></script>
</head>
<body>
<div class="app" x-data="plywood()" x-cloak @keydown.window="rowKeys($event)">
  <header class="bar">
    <div class="brand">Plywood</div>
    <input class="job" x-model="state.job" aria-label="Job name" spellcheck="false">
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Units">
      <button :class="{on: state.units === 'in'}" @click="changeUnits('in')">in</button>
      <button :class="{on: state.units === 'mm'}" @click="changeUnits('mm')">mm</button>
    </div>
    <button @click="newJob()">New</button>
    <button @click="open()">Open…</button>
    <button @click="saveJob()">Save…</button>
    <div class="menus" @click.outside="menu = null" @keydown.escape.window="menu = null">
    <div class="menu">
      <button :class="{on: menu === 'import'}" @click="menu = menu === 'import' ? null : 'import'">Import ▾</button>
      <div class="items" x-show="menu === 'import'" @click="menu = null">
        <button @click="$refs.importParts.click()">Parts (CSV or Onshape BOM)…</button>
        <button @click="$refs.importStock.click()">Stock CSV…</button>
        <button @click="$refs.importSettings.click()">Settings…</button>
        <button @click="boardsText = ''; dialog = 'boards'">Boards from phone…</button>
      </div>
    </div>
    <div class="menu">
      <button :class="{on: menu === 'export'}" @click="menu = menu === 'export' ? null : 'export'">Export ▾</button>
      <div class="items" x-show="menu === 'export'" @click="menu = null">
        <button @click="printReport()">Print report…</button>
        <button @click="exportCsv()">Cut list CSV…</button>
        <button @click="exportTable('parts')">Parts CSV…</button>
        <button @click="exportTable('stock')">Stock CSV…</button>
        <button @click="exportSettings()">Settings…</button>
        <button @click="openPhone()">Shopping list for phone…</button>
      </div>
    </div>
    </div>
    <input type="file" x-ref="openJob" accept=".json" hidden @change="openJob($event)">
    <input type="file" x-ref="importParts" accept=".csv,text/csv" hidden @change="importFile($event, 'parts')">
    <input type="file" x-ref="importStock" accept=".csv,text/csv" hidden @change="importFile($event, 'stock')">
    <input type="file" x-ref="importSettings" accept=".json" hidden @change="importSettings($event)">
    <datalist id="mat-sheet">
      <template x-for="t in materials('sheet')" :key="t"><option :value="t"></option></template>
    </datalist>
    <datalist id="mat-dimensional">
      <template x-for="t in materials('dimensional')" :key="t"><option :value="t"></option></template>
    </datalist>
    <datalist id="mat-hardwood">
      <template x-for="t in materials('hardwood')" :key="t"><option :value="t"></option></template>
    </datalist>
  </header>

  <div class="dialog-bg" x-show="dialog" x-transition.opacity @click.self="closeDialog()" @keydown.escape.window="closeDialog()">
    <div class="dialog" x-show="dialog === 'ask'">
      <h3 x-text="question.title"></h3>
      <div class="buttons">
        <template x-for="[value, label, primary] in question.buttons" :key="value">
          <button :class="{primary}" @click="answer(value)" x-text="label"></button>
        </template>
      </div>
    </div>
    <div class="dialog" x-show="dialog === 'phone'">
      <h3>Shopping list for phone</h3>
      <label>Phone page address
        <input x-model="state.phone_url" placeholder="https://…/shop/" spellcheck="false" @input.debounce.300ms="makePhoneLink()"></label>
      <template x-if="phone.link">
        <div>
          <div class="qr" x-show="phone.qr" x-html="phone.qr"></div>
          <p class="muted" x-show="!phone.qr">Too big for a QR code: copy the link instead.</p>
          <div class="linkrow"><input readonly :value="phone.link" @focus="$event.target.select()"><button @click="copyText(phone.link)">Copy</button></div>
        </div>
      </template>
      <div class="buttons"><button @click="dialog = null">Close</button></div>
    </div>
    <div class="dialog" x-show="dialog === 'boards'">
      <h3>Boards from phone</h3>
      <textarea x-model="boardsText" rows="4" placeholder="Paste the link from the phone" spellcheck="false"></textarea>
      <div class="buttons">
        <button class="primary" @click="addBoards()" :disabled="!boardsText.trim()">Add to stock</button>
        <button @click="dialog = null">Cancel</button>
      </div>
    </div>
  </div>

  <div class="flash" x-show="flash.text" x-transition.opacity :class="flash.kind" x-text="flash.text" @click="flash.text = ''"></div>

  <main>
    <section class="workspace">
      <nav class="tabs">
        <button :class="{on: tab === 'parts'}" @click="tab = 'parts'">Parts <span class="count" x-text="countRows('parts')"></span></button>
        <button :class="{on: tab === 'shopping'}" @click="tab = 'shopping'">Shopping list <span class="count" x-text="result?.stats?.shop || ''"></span></button>
        <button :class="{on: tab === 'stock'}" @click="tab = 'stock'">Stock <span class="count" x-text="countRows('stock')"></span></button>
        <button :class="{on: tab === 'output'}" @click="tab = 'output'">Cut list <span class="count" x-text="result?.stats?.stock || ''"></span></button>
        <button :class="{on: tab === 'settings'}" @click="tab = 'settings'">Settings</button>
      </nav>

      <!-- Parts -->
      <div class="panel" x-show="tab === 'parts'">
        <div class="tagwarn" x-show="(state.skipped || []).length">
          <span><b>Not imported (no cut list dims in Onshape):</b> <span x-text="(state.skipped || []).join(', ')"></span></span>
          <button class="del" title="Dismiss" @click="state.skipped = []">×</button>
        </div>
        <div class="tools">
          <button class="ghost" @click="clearTable('parts')">Clear</button>
          <template x-if="sel.table === 'parts' && sel.rows.length">
            <div class="rowbar">
              <span class="muted" x-text="sel.rows.length + (sel.rows.length > 1 ? ' rows' : ' row')"></span>
              <button @click="duplicateRows()" title="Ctrl+D">Duplicate</button>
              <button @click="copyRows()" title="Ctrl+C">Copy</button>
              <button @click="deleteRows()" title="Delete">Delete</button>
            </div>
          </template>
        </div>
        <table class="grid" @focusin="if ($event.target.tagName !== 'BUTTON') clearSel()">
          <colgroup><col class="num"><col><col class="dim"><col class="dim"><col class="dim"><col class="qty"><col class="grain"><col class="sel"><col class="tag"><col class="x"></colgroup>
          <thead><tr>
            <th></th><th>Name</th><th>Length</th><th>Width</th><th>Thick</th><th>Qty</th>
            <th title="Which way the grain runs: along the part's length or width">Grain</th><th>Kind</th><th>Material</th><th></th>
          </tr></thead>
          <tbody>
            <template x-for="(row, i) in state.parts" :key="i">
              <tr :class="{sel: isSelected('parts', i)}">
                <td class="rownum"><button x-show="!isBlank(row)" :class="{on: isSelected('parts', i)}" @click="select($event, 'parts', i)" x-text="i + 1"></button></td>
                <template x-for="f in ['name', 'length', 'width', 'thickness', 'qty']" :key="f">
                  <td><input x-model="row[f]" :class="cellClass('parts', i, f)" :title="cellError('parts', i, f) || row[f]"
                             :placeholder="f === 'qty' ? '1' : ''" spellcheck="false"
                             @input="ensureBlank('parts')" @paste="paste($event, 'parts', i, f)"
                             @keydown.enter.prevent="moveDown($event)"></td>
                </template>
                <td><select x-model="row.grain"><option value="">any</option><option value="length">L</option><option value="width">W</option></select></td>
                <td><select x-model="row.kind"><option value="sheet">sheet</option><option value="dimensional">dimensional</option><option value="hardwood">hardwood</option></select></td>
                <td><input x-model="row.tag" :list="'mat-' + row.kind" placeholder="any" spellcheck="false" @input="ensureBlank('parts')" @paste="paste($event, 'parts', i, 'tag')"></td>
                <td><button class="del" x-show="!isBlank(row)" @click="removeRow('parts', i)" title="Remove row">×</button></td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>

      <!-- Stock -->
      <div class="panel output" x-show="tab === 'shopping'">
        <div class="tools">
          <button @click="openPhone()" :disabled="!result || !result.ok || !result.stats">Send to phone…</button>
        </div>
        <template x-if="busy"><span class="spin">Optimizing…</span></template>
        <template x-if="!busy && result && !result.ok">
          <div class="problems">
            <b x-text="result.message || ('Fix ' + result.errors.length + ' highlighted cell' + (result.errors.length > 1 ? 's' : ''))"></b>
            <button x-show="result.stale" @click="reoptimize()">Re-optimize</button>
          </div>
        </template>
        <template x-if="!busy && result && result.ok && result.stats">
          <div class="summary shopping" x-html="result.shopping || '<p class=muted>Nothing to buy or find.</p>'"></div>
        </template>
      </div>

      <div class="panel" x-show="tab === 'stock'">
        <div class="tools">
          <button class="ghost" @click="clearTable('stock')">Clear</button>
          <template x-if="sel.table === 'stock' && sel.rows.length">
            <div class="rowbar">
              <span class="muted" x-text="sel.rows.length + (sel.rows.length > 1 ? ' rows' : ' row')"></span>
              <button @click="duplicateRows()" title="Ctrl+D">Duplicate</button>
              <button @click="copyRows()" title="Ctrl+C">Copy</button>
              <button @click="deleteRows()" title="Delete">Delete</button>
            </div>
          </template>
        </div>
        <table class="grid stock" @focusin="if ($event.target.tagName !== 'BUTTON') clearSel()">
          <colgroup><col class="num"><col class="sel"><col class="size"><col class="dim"><col class="dim"><col class="dim"><col class="onhand"><col class="edges"><col class="rough"><col class="mat"><col class="x"></colgroup>
          <thead><tr>
            <th></th><th>Kind</th><th>Size</th><th>Length</th><th>Width</th><th>Thick</th>
            <th title="How many you have. 0 = buy what's needed">On hand</th><th title="Click an edge to trim it">Trim</th>
            <th title="Rough-sawn: gets jointed and planed">Rough</th><th>Material</th><th></th>
          </tr></thead>
          <tbody>
            <template x-for="(row, i) in state.stock" :key="i">
              <tr :class="{sel: isSelected('stock', i)}">
                <td class="rownum"><button x-show="!isBlank(row)" :class="{on: isSelected('stock', i)}" @click="select($event, 'stock', i)" x-text="i + 1"></button></td>
                <td><select x-model="row.kind"><option value="sheet">sheet</option><option value="dimensional">dimensional</option><option value="hardwood">hardwood</option></select></td>
                <td><select x-show="row.kind === 'dimensional'" @change="setNominal(row, $event.target.value)">
                  <option value="" :selected="!nominalOf(row)">custom</option>
                  <template x-for="n in dimensionalNames" :key="n"><option :value="n" x-text="n" :selected="n === nominalOf(row)"></option></template>
                </select></td>
                <template x-for="f in ['length', 'width', 'thickness', 'qty']" :key="f">
                  <td><input x-model="row[f]" :class="cellClass('stock', i, f)" :title="cellError('stock', i, f) || row[f]"
                             :placeholder="stockPlaceholder(row, f)" spellcheck="false"
                             @input="ensureBlank('stock')" @paste="paste($event, 'stock', i, f)"
                             @keydown.enter.prevent="moveDown($event)"></td>
                </template>
                <td>
                  <svg class="edges" viewBox="0 0 60 32">
                    <rect x="9" y="9" width="42" height="14"/>
                    <line x1="9" y1="4" x2="51" y2="4" :class="{on: hasEdge(row, 't')}" @click="toggleEdge(row, 't')"><title>Top</title></line>
                    <line x1="9" y1="28" x2="51" y2="28" :class="{on: hasEdge(row, 'b')}" @click="toggleEdge(row, 'b')"><title>Bottom</title></line>
                    <line x1="4" y1="9" x2="4" y2="23" :class="{on: hasEdge(row, 'l')}" @click="toggleEdge(row, 'l')"><title>Left end</title></line>
                    <line x1="56" y1="9" x2="56" y2="23" :class="{on: hasEdge(row, 'r')}" @click="toggleEdge(row, 'r')"><title>Right end</title></line>
                  </svg>
                </td>
                <td class="center"><input type="checkbox" x-show="row.kind === 'hardwood'" x-model="row.rough"></td>
                <td><input x-model="row.tag" :list="'mat-' + row.kind" placeholder="any" spellcheck="false" @input="ensureBlank('stock')" @paste="paste($event, 'stock', i, 'tag')"></td>
                <td><button class="del" x-show="!isBlank(row)" @click="removeRow('stock', i)" title="Remove row">×</button></td>
              </tr>
            </template>
          </tbody>
        </table>

        <template x-if="tagInfo().length">
          <div class="tagtable">
            <h4>Materials in use</h4>
            <table>
              <tr><th>Material</th><th>Sheet parts</th><th>Lumber parts</th><th>Sheet stock</th><th>Lumber stock</th><th></th><th>Same as…</th></tr>
              <template x-for="t in tagInfo()" :key="t.tag">
                <tr>
                  <td><b x-text="t.tag"></b></td>
                  <td x-text="t.sheetParts || '–'"></td>
                  <td x-text="t.boardParts || '–'"></td>
                  <td x-text="t.sheetStock || '–'"></td>
                  <td x-text="t.boardStock || '–'"></td>
                  <td class="muted" x-text="t.note"></td>
                  <td>
                    <select @change="if ($event.target.value) sameTag(t.tag, $event.target.value); $event.target.value = ''">
                      <option value="">—</option>
                      <template x-for="o in tagInfo().filter(o => o.tag !== t.tag)" :key="o.tag">
                        <option :value="o.tag" x-text="o.tag"></option>
                      </template>
                    </select>
                  </td>
                </tr>
              </template>
            </table>
          </div>
        </template>

        <template x-if="Object.keys(state.tag_aliases || {}).length || (state.tag_distinct || []).length">
          <div class="tagtable">
            <h4>Material matches you've set</h4>
            <ul class="decisions">
              <template x-for="[from, to] in Object.entries(state.tag_aliases)" :key="from">
                <li><b x-text="from"></b> → <b x-text="to"></b> <button class="del" title="Forget" @click="forgetAlias(from)">×</button></li>
              </template>
              <template x-for="(key, i) in state.tag_distinct" :key="key">
                <li><span x-text="key.replace(' | ', ' ≠ ')"></span> <button class="del" title="Forget" @click="state.tag_distinct.splice(i, 1)">×</button></li>
              </template>
            </ul>
          </div>
        </template>
      </div>

      <div class="tip" x-show="tipBox.text" x-text="tipBox.text" :style="`left:${tipBox.x}px;top:${tipBox.y}px`"
           @click.outside="tipBox.text = ''" @keydown.escape.window="tipBox.text = ''"></div>
      <!-- Settings -->
      <div class="panel settings" x-show="tab === 'settings'">
        <section>
          <h4>Blade kerf</h4>
          <template x-for="[f, label, note, tip] in [['track_saw_kerf', 'Track saw', state.settings.sheet_saw === 'table' ? '' : 'sheets', 'Blade width of track saw'],
                                                ['table_saw_kerf', 'Table saw', state.settings.sheet_saw === 'table' ? 'sheets, board rips' : 'board rips', 'Blade width of table saw'],
                                                ['miter_saw_kerf', 'Miter saw', 'board crosscuts', 'Blade width of miter saw'],
                                                ['jig_saw_kerf', 'Jig saw', 'rough boards', 'Blade width of jig saw, used to cut rough boards into shorter pieces']]" :key="f">
            <label class="row"><span><span x-text="label"></span><span class="info" x-show="tip" @click.prevent.stop="showTip($event, tip)">i</span><span class="note" x-text="note"></span></span>
              <input x-model="state.settings[f]" :class="cellClass('settings', 0, f)"></label>
          </template>
          <label class="row"><span>Cut sheets on<span class="info" @click.prevent.stop="showTip($event, 'Which saw breaks down sheets')">i</span></span>
            <select x-model="state.settings.sheet_saw"><option value="track">Track saw</option><option value="table">Table saw</option></select></label>
        </section>

        <section>
          <h4>Trim and oversize</h4>
          <template x-for="[f, label, note, tip] in [['edge_trim', 'Edge trim', 'per side', 'Cut off each stock edge marked in Trim column'],
                                                ['sheet_allowance', 'Oversize: sheets', 'total, length and width', 'Cut sheet parts this much bigger, to trim to size later']]" :key="f">
            <label class="row"><span><span x-text="label"></span><span class="info" x-show="tip" @click.prevent.stop="showTip($event, tip)">i</span><span class="note" x-text="note"></span></span>
              <input x-model="state.settings[f]" :class="cellClass('settings', 0, f)"></label>
          </template>
        </section>

        <section>
          <h4>Planing</h4>
          <template x-for="[f, label, note, tip] in [['max_planing', 'Max planing', 'total', 'Board can be at most this much thicker than part'],
                                                ['rough_cleanup', 'Min planing, rough boards', 'total', 'Rough boards need at least this much planed off to come out flat'],
                                                ['edge_joint', 'Edge jointing', 'one side', 'Taken off one edge of rough board on jointer'],
                                                ['min_planer_length', 'Shortest piece to plane', '', 'Pieces shorter than this don\'t go through planer'],
                                                ['snipe', 'Snipe', 'per end', 'Extra length on each end of planed piece, cut off after planing']]" :key="f">
            <label class="row"><span><span x-text="label"></span><span class="info" x-show="tip" @click.prevent.stop="showTip($event, tip)">i</span><span class="note" x-text="note"></span></span>
              <input x-model="state.settings[f]" :class="cellClass('settings', 0, f)"></label>
          </template>
        </section>

        <section>
          <h4>Dimensional lumber</h4>
          <template x-for="[f, label, note, tip] in [['dimensional_lengths', 'Lengths sold', '', 'e.g. 8\', 10\', 12\'']]" :key="f">
            <label class="row"><span><span x-text="label"></span><span class="info" x-show="tip" @click.prevent.stop="showTip($event, tip)">i</span><span class="note" x-text="note"></span></span>
              <input x-model="state.settings[f]" :class="cellClass('settings', 0, f)"></label>
          </template>
          <label class="check"><input type="checkbox" x-model="state.settings.default_dimensional"> Buy standard sizes when Stock has none</label>
        </section>

        <section>
          <h4>Hardwood shopping list</h4>
          <template x-for="[f, label, note, tip] in [['combine_width', 'Join parts end to end', 'max width difference', 'Parts this close in width go end to end in one piece'],
                                                ['combine_length', 'Longest joined piece', '', 'Parts end to end stop at this length'],
                                                ['min_piece_width', 'Narrowest piece', '', 'Narrower parts go side by side in one piece, to rip apart'],
                                                ['piece_extra_width', 'Extra width', 'total', 'Added to each piece to joint one edge and rip other']]" :key="f">
            <label class="row"><span><span x-text="label"></span><span class="info" x-show="tip" @click.prevent.stop="showTip($event, tip)">i</span><span class="note" x-text="note"></span></span>
              <input x-model="state.settings[f]" :class="cellClass('settings', 0, f)"></label>
          </template>
        </section>

        <section>
          <h4>Spares</h4>
          <template x-for="[f, label, note, tip] in [['spare_sheets', 'Spare sheets', 'per kind', 'Extra sheets to buy of each kind'],
                                                ['spare_sticks', 'Spare dimensional', 'per size', 'Extra dimensional lumber to buy of each size'],
                                                ['spare_pct', 'Spare hardwood, %', 'per size', 'Extra hardwood pieces of each size, as a percent, rounded up'],
                                                ['waste_pct', 'Yield loss, %', '', 'Added to the board-foot estimate to cover offcuts, since boards rarely match the pieces exactly']]" :key="f">
            <label class="row"><span><span x-text="label"></span><span class="info" x-show="tip" @click.prevent.stop="showTip($event, tip)">i</span><span class="note" x-text="note"></span></span>
              <input x-model="state.settings[f]" :class="cellClass('settings', 0, f)"></label>
          </template>
        </section>

        <section>
          <h4>General</h4>
          <label class="check"><input type="checkbox" x-model="state.settings.default_sheets"> Buy 4×8 sheets when Stock has none</label>
          <label class="row"><span>Round fractions to</span>
            <select x-model.number="state.denominator"><option value="8">1/8"</option><option value="16">1/16"</option><option value="32">1/32"</option></select></label>
          <label class="row wide"><span>Layouts to try<span class="info" @click.prevent.stop="showTip($event, 'More can find better cut list, but takes longer')">i</span> <span class="note" x-text="state.settings.tries"></span></span>
            <input type="range" min="0" max="5000" step="100" x-model.number="state.settings.tries"></label>
        </section>
      </div>
      <div class="panel output" x-show="tab === 'output'">
      <div class="status">
        <div class="priority">
          <span class="muted">Prefer</span>
          <div class="seg" role="group" aria-label="Optimization priority">
            <button :class="{on: state.settings.priority === 'waste'}" @click="state.settings.priority = 'waste'"
                    title="Keep the leftover in as few, large pieces as possible">Big leftovers</button>
            <button :class="{on: state.settings.priority === 'balanced'}" @click="state.settings.priority = 'balanced'"
                    title="Fewer cuts, unless that leaves only small offcuts">Balanced</button>
            <button :class="{on: state.settings.priority === 'cuts'}" @click="state.settings.priority = 'cuts'"
                    title="Fewest cuts: cut strips, then cut them to length">Simplest cutting</button>
          </div>
          <button class="ghost reopt" x-show="!busy && result && (result.ok || result.stale)" @click="reoptimize()">Re-optimize</button>
        </div>
        <template x-if="busy"><span class="spin">Optimizing…</span></template>
        <template x-if="!busy && result && result.ok && result.stats">
          <div class="stats">
            <span><b x-text="result.stats.stock"></b> stock pieces</span>
            <span><b x-text="result.stats.buy"></b> to buy</span>
            <span x-show="result.stats.find"><b x-text="result.stats.find"></b> to find</span>
            <span><b x-text="result.stats.cuts"></b> cuts</span>
            <span><b x-text="result.stats.waste.toFixed(1) + '%'"></b> waste</span>
            <span class="warn" x-show="result.stats.unplaced"><b x-text="result.stats.unplaced"></b> not placed</span>
          </div>
        </template>
      </div>

      <template x-for="q in tagQuestions()" :key="q.key">
        <div class="tagwarn">
          <span>Are <b x-text="q.likely"></b> and <b x-text="q.other"></b> the same material?</span>
          <button @click="sameTag(q.other, q.likely)" x-text="'Same, call it ' + q.likely"></button>
          <button @click="sameTag(q.likely, q.other)" x-text="'Same, call it ' + q.other"></button>
          <button @click="differentTags(q.key)">Different</button>
        </div>
      </template>

      <template x-if="result && !result.ok">
        <div class="problems">
          <b x-text="result.message || ('Fix ' + result.errors.length + ' highlighted cell' + (result.errors.length > 1 ? 's' : ''))"></b>
          <ul><template x-for="e in (result.errors || []).slice(0, 8)"><li x-text="describe(e)"></li></template></ul>
          <button x-show="result.stale" @click="reoptimize()">Re-optimize</button>
        </div>
      </template>

      <template x-if="result && result.empty">
        <div class="empty">
          <h2>Add parts</h2>
        </div>
      </template>

      <template x-if="result && result.ok && result.sheets">
        <div>
          <div class="summary" x-html="result.summary"></div>
          <template x-for="s in result.sheets" :key="s.number">
            <article class="sheet">
              <div class="sheethead">
                <div class="sheettitle">
                  <h3 x-text="s.title"></h3>
                  <div class="layouts" x-show="s.options > 1">
                    <button title="Previous layout" :disabled="s.option === 0 || !!switching" @click="choose(s, s.option - 1)">‹</button>
                    <span x-text="(s.option + 1) + ' / ' + s.options"></span>
                    <button title="Next layout" :disabled="s.option >= s.options - 1 || !!switching" @click="choose(s, s.option + 1)">›</button>
                  </div>
                </div>
                <p class="muted" x-text="s.note"></p>
                <div class="svgwrap" x-html="s.svg"></div>
              </div>
              <div class="sheetsteps" x-html="s.steps"
                   @mouseover="highlight($event, true)" @mouseout="highlight($event, false)"></div>
            </article>
          </template>
        </div>
      </template>
      </div>
    </section>
  </main>
</div>
</body>
</html>
