[project]
name = "plywood"
version = "0.1.0"
description = "Cut list optimizer for sheet goods and lumber"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
plywood = "plywood.cli:main"
plywood-app = "plywood.app.desktop:main"

[dependency-groups]
dev = ["pytest>=8"]
desktop = ["pywebview>=6.2"]

[tool.uv]
default-groups = ["dev", "desktop"]

[build-system]
requires = ["uv_build>=0.9,<1"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
